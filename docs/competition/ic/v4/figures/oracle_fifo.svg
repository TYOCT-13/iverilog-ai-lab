<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="660" viewBox="0 0 1800 660">
<rect width="1800" height="660" fill="#F7F9FB"/>
<text x="55" y="79" fill="#17212B" font-family="Microsoft YaHei" font-size="54" font-weight="700">FIFO 同拍读写的语义修复</text>
<text x="55" y="135" fill="#566575" font-family="Microsoft YaHei" font-size="30" font-weight="400">展示计数更新机制，图中没有使用芯片实测波形</text>
<line x1="55" y1="170" x2="1745" y2="170" stroke="#D8E0E6" stroke-width="2"/>
<rect x="55" y="215" width="760" height="265" fill="white" stroke="#D8E0E6" stroke-width="2"/>
<text x="75" y="264" fill="#009FBA" font-family="Microsoft YaHei" font-size="31" font-weight="700">旧机制</text>
<text x="75" y="318" fill="#17212B" font-family="Microsoft YaHei" font-size="38" font-weight="700">两次赋值更新 count</text>
<text x="75" y="368" fill="#566575" font-family="Microsoft YaHei" font-size="29" font-weight="400">接受写入：count + 1</text>
<text x="75" y="409" fill="#566575" font-family="Microsoft YaHei" font-size="29" font-weight="400">接受读取：count - 1</text>
<text x="75" y="450" fill="#566575" font-family="Microsoft YaHei" font-size="29" font-weight="400">后一次非阻塞赋值覆盖前一次</text>
<rect x="985" y="215" width="760" height="265" fill="#E8F5F8" stroke="#D8E0E6" stroke-width="2"/>
<text x="1005" y="264" fill="#009FBA" font-family="Microsoft YaHei" font-size="31" font-weight="700">修复机制</text>
<text x="1005" y="318" fill="#17212B" font-family="Microsoft YaHei" font-size="38" font-weight="700">按接受组合更新一次</text>
<text x="1005" y="368" fill="#566575" font-family="Microsoft YaHei" font-size="29" font-weight="400">仅写：+1    仅读：-1</text>
<text x="1005" y="409" fill="#566575" font-family="Microsoft YaHei" font-size="29" font-weight="400">同时接受：保持占用量</text>
<text x="1005" y="450" fill="#566575" font-family="Microsoft YaHei" font-size="29" font-weight="400">空与满边界按前态判定</text>
<line x1="840" y1="345" x2="960" y2="345" stroke="#009FBA" stroke-width="4"/>
<line x1="960" y1="345" x2="944" y2="335" stroke="#009FBA" stroke-width="4"/>
<line x1="960" y1="345" x2="944" y2="355" stroke="#009FBA" stroke-width="4"/>
<text x="55" y="575" fill="#566575" font-family="Microsoft YaHei" font-size="35" font-weight="400">规格先明确，同时修正 RTL 与参考模型，再逐拍核对输出</text>
</svg>