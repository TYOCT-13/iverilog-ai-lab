[build-system]
requires = []
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "iverilog-ai-lab"
version = "0.1.0"
description = "A controlled AI-assisted verification extension around Icarus Verilog"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
  {name = "Icarus 智测 contributors"},
]
dependencies = [
  "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
ui = [
  "streamlit>=1.30",
]

[project.scripts]
iverilog-ai = "iverilog_ai.core.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
