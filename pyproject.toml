[build-system]
requires = []
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "iverilog-ai-lab"
version = "0.1.0"
description = "A controlled AI-assisted verification extension around Icarus Verilog"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
  {name = "Icarus 智测 contributors"},
]
dependencies = [
  "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
ui = [
  "streamlit>=1.30",
]

[project.scripts]
iverilog-ai = "iverilog_ai.core.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

# 类型检查门禁（`python -m mypy src ui scripts`）。当前三处都是 0 error，
# 因此它是"可执行的标准"，而不是一份摆设的配置。
# - `explicit_package_bases` + `mypy_path`：scripts/ 与 ui/ 不是包，但里面的模块
#   会互相导入，不给这两个开关 mypy 会报"同一个文件出现在两个模块名下"。
# - `ignore_missing_imports`：pydantic/streamlit/PIL/fitz 的 stub 并不完整，
#   缺 stub 不应该让门禁失效。
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
show_error_codes = true
files = ["src", "ui", "scripts"]
