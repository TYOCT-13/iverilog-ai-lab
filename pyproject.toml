[build-system]
# 必须声明 setuptools：pip 默认在**隔离环境**里构建，`requires = []` 会让构建后端
# 连自己都导不进来，于是文档里的第一步 `pip install -e .` 直接失败
# （报 `ModuleNotFoundError: No module named 'setuptools'`），而本机明明装了 setuptools。
# 离线环境可以用 `pip install -e . --no-build-isolation` 跳过隔离构建。
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iverilog-ai-lab"
version = "0.1.0"
description = "A controlled AI-assisted verification extension around Icarus Verilog"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
  {name = "Icarus 智测 contributors"},
]
dependencies = [
  "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
ui = [
  "streamlit>=1.30",
]
# 复核与开发所需的依赖。**没有这条 extra 时，`10 分钟复核指南`第 4 节是跑不起来的**：
# 实测在全新虚拟环境里 `pip install -e .` 之后，`python -m pytest -q` 与 `python -m mypy`
# 都报 "No module named ..."——因为核心依赖只有 pydantic。
# PyMuPDF(fitz) 与 Pillow 不是可选的：渲染器测试与图标测试在模块级 import 它们。
dev = [
  "pytest>=7.4",
  "mypy>=1.8",
  "PyMuPDF>=1.23",
  "Pillow>=10.0",
  # PyYAML：GitHub Action 定义的那 10 条测试在模块级 importorskip("yaml")，
  # 缺它不会报错，只会**静默少收集 10 条**——"少测了"比"测失败"更危险。
  "PyYAML>=6.0",
]

[project.scripts]
iverilog-ai = "iverilog_ai.core.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

# 类型检查门禁（`python -m mypy src ui scripts`）。当前三处都是 0 error，
# 因此它是"可执行的标准"，而不是一份摆设的配置。
# - `explicit_package_bases` + `mypy_path`：scripts/ 与 ui/ 不是包，但里面的模块
#   会互相导入，不给这两个开关 mypy 会报"同一个文件出现在两个模块名下"。
# - `ignore_missing_imports`：pydantic/streamlit/PIL/fitz 的 stub 并不完整，
#   缺 stub 不应该让门禁失效。
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
show_error_codes = true
files = ["src", "ui", "scripts"]
