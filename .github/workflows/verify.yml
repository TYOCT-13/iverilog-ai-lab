name: verify
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Install package
        run: |
          python -m pip install uv==0.9.9
          uv sync --locked --extra dev --extra ui --python 3.12
      - name: Unit tests
        run: uv run --no-sync python -m pytest
      - name: Reference traffic-light case
        run: uv run --no-sync iverilog-ai run --allowed-root . --rtl rtl/traffic_light_emergency.v --testbench tb/tb_traffic_light_emergency.v --top tb_traffic_light_emergency --output-dir .ci-runs/traffic --report-format none
      - name: Reference mod10 case
        run: uv run --no-sync iverilog-ai run --allowed-root . --rtl rtl/mod10_counter.v --testbench tb/tb_mod10_counter.v --top tb_mod10_counter --output-dir .ci-runs/mod10 --report-format none
