name: verify
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Install package
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m pytest
      - name: Reference traffic-light case
        run: iverilog-ai run --allowed-root . --rtl rtl/traffic_light_emergency.v --testbench tb/tb_traffic_light_emergency.v --top tb_traffic_light_emergency --output-dir .ci-runs/traffic --report-format none
      - name: Reference mod10 case
        run: iverilog-ai run --allowed-root . --rtl rtl/mod10_counter.v --testbench tb/tb_mod10_counter.v --top tb_mod10_counter --output-dir .ci-runs/mod10 --report-format none
